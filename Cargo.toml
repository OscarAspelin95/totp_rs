[workspace]
members = ["crates/*"]
resolver = "3"

[workspace-package]
name = "totp_rs"
edition = "2024"

[workspace.dependencies]
# ext. dependencies
anyhow = { version = "1.0.104" }
chrono = { version = "0.4.45" }
dotenv = { version = "0.15.0" }
hmac = { version = "0.13.0" }
sha2 = { version = "0.11.1" }
thiserror = { version = "2.0.21" }
axum = { version = "0.8.9" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
serde = { version = "*", features = ["derive"] }
tower-http = { version = "*", features = ["trace"] }
base32 = { version = "0.5.1" }
rand = { version = "0.10.3" }
uuid = { version = "*", features = ["v7", "serde"] }
clap = { version = "*", features = ["derive"] }
turso = { version = "*" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.2"
color-eyre = "0.6.5"
# int. crates
errors = { version = "0.0.1", path = "crates/errors" }
totp = { version = "0.0.1", path = "crates/totp" }
server = { version = "0.0.1", path = "crates/server" }
client = { version = "0.0.1", path = "crates/client" }
db = { version = "0.0.1", path = "crates/db" }
tui = { version = "0.0.1", path = "crates/tui" }
